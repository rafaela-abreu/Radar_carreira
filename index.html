<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar da Carreira - Autônomo</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    :root {
      --bg-color: #0d0f17;
      --surface-card: #161926;
      --surface-input: #1f2436;
      --primary-color: #6366f1;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #2e354f;
      --font-size-base: 14px;
      --border-radius: 12px;
    }

    body.theme-paper {
      --bg-color: #f4f1ea;
      --surface-card: #ffffff;
      --surface-input: #e8e4d9;
      --primary-color: #8b5cf6;
      --text-main: #2d2b2a;
      --text-muted: #736f6d;
      --border-color: #d6d0c4;
    }

    body.theme-emerald {
      --bg-color: #061712;
      --surface-card: #0d2820;
      --surface-input: #14382d;
      --primary-color: #10b981;
      --text-main: #ecfdf5;
      --text-muted: #6ee7b7;
      --border-color: #1b4d3e;
    }

    body.theme-cyberpunk {
      --bg-color: #120024;
      --surface-card: #220038;
      --surface-input: #360057;
      --primary-color: #ff007f;
      --text-main: #00ffff;
      --text-muted: #ff7700;
      --border-color: #ff0055;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-size: var(--font-size-base);
      min-height: 100vh;
      padding: 12px;
      display: flex;
      justify-content: center;
    }

    #app-wrapper {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    header {
      background: var(--surface-card);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: var(--border-radius);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--text-main);
    }

    .status-card {
      background: var(--surface-card);
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: var(--border-radius);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .nav-scroller {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .nav-btn {
      background: var(--surface-card);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: var(--border-radius);
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .nav-btn.active {
      background: var(--primary-color);
      color: #fff;
      border-color: var(--primary-color);
    }

    .tab-pane {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .tab-pane.active {
      display: flex;
    }

    .card {
      background: var(--surface-card);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-action {
      display: flex;
      gap: 8px;
    }

    .form-control {
      background: var(--surface-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: var(--border-radius);
      outline: none;
      width: 100%;
    }

    .btn-primary {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: var(--border-radius);
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .shelf-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .shelf-item {
      background: var(--surface-card);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tag {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .tag-success { background: #059669; color: #fff; }
    .tag-warning { background: #d97706; color: #fff; }

    .theme-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div id="app-wrapper">
    <header>
      <div class="brand-title">🛰️ RADAR AUTÔNOMO</div>
      <button class="btn-primary" style="padding:6px 12px; font-size:0.8rem;" onclick="trocarAba('tab-theme')">🎨 Tema</button>
    </header>

    <div class="status-card">
      <span id="status-auto">⚡ Modulo de busca autônoma pronto.</span>
    </div>

    <nav class="nav-scroller">
      <button class="nav-btn active" id="btn-tab-vagas" onclick="trocarAba('tab-vagas')">💼 Vagas</button>
      <button class="nav-btn" id="btn-tab-curriculo" onclick="trocarAba('tab-curriculo')">📄 Meu Perfil (CV)</button>
      <button class="nav-btn" id="btn-tab-theme" onclick="trocarAba('tab-theme')">🎨 Temas</button>
    </nav>

    <!-- ESTANTE DE VAGAS -->
    <section id="tab-vagas" class="tab-pane active">
      <div class="card-action">
        <button class="btn-primary" onclick="buscarVagasNaWeb()">🔄 Buscar Vagas Agora</button>
        <input type="text" class="form-control" placeholder="🔍 Filtrar..." oninput="filtrarVagas(this.value)">
      </div>
      <div id="estante-vagas" class="shelf-grid">
        <div class="card" style="grid-column: 1/-1;">
          <p style="color:var(--text-muted); text-align:center;">Clique em "Buscar Vagas Agora" para puxar e analisar oportunidades automaticamente.</p>
        </div>
      </div>
    </section>

    <!-- MEU PERFIL (CV PARSER) -->
    <section id="tab-curriculo" class="tab-pane">
      <div class="card">
        <h3>📄 Base do Seu Perfil</h3>
        <p style="font-size:0.8rem; color:var(--text-muted);">Anexe seu currículo em PDF para o robô extrair suas competências e calcular a compatibilidade.</p>
        <input type="file" id="cv-file" class="form-control" accept="application/pdf" onchange="extrairPDF()">
        <textarea id="cv-text" class="form-control" rows="6" placeholder="O texto extraído do seu currículo aparecerá aqui..."></textarea>
      </div>
    </section>

    <!-- TEMAS -->
    <section id="tab-theme" class="tab-pane">
      <div class="card">
        <h3>🎨 Escolha a Aparência</h3>
        <div class="theme-grid">
          <button class="btn-primary" style="background:#6366f1;" onclick="aplicarTema('default')">Dark Purple</button>
          <button class="btn-primary" style="background:#8b5cf6; color:#fff;" onclick="aplicarTema('paper')">Paper Light</button>
          <button class="btn-primary" style="background:#10b981;" onclick="aplicarTema('emerald')">Emerald</button>
          <button class="btn-primary" style="background:#ff007f;" onclick="aplicarTema('cyberpunk')">Cyberpunk</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    // LISTA DE HABILIDADES PARA CRUZAMENTO
    const TECH_SKILLS = ['javascript', 'js', 'html', 'css', 'react', 'node', 'sql', 'python', 'git', 'github', 'figma'];

    // GERENCIADOR DE ABAS
    function trocarAba(abaId) {
      document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(abaId).classList.add('active');
      const btn = document.getElementById('btn-' + abaId);
      if (btn) btn.classList.add('active');
    }

    // EXTRAÇÃO DO CURRÍCULO (PDF)
    async function extrairPDF() {
      const fileInput = document.getElementById('cv-file');
      if (!fileInput.files[0]) return;

      document.getElementById('status-auto').innerText = "📄 Lendo e extraindo dados do seu currículo...";
      const reader = new FileReader();

      reader.onload = async function() {
        try {
          const typedarray = new Uint8Array(this.result);
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
          const pdf = await pdfjsLib.getDocument(typedarray).promise;
          let textoCompleto = '';

          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            textoCompleto += content.items.map(item => item.str).join(' ') + '\n';
          }

          document.getElementById('cv-text').value = textoCompleto;
          localStorage.setItem('cv_texto_base', textoCompleto);
          document.getElementById('status-auto').innerText = "✅ Perfil carregado e pronto para cruzamento!";
        } catch (e) {
          alert("Erro ao ler PDF. Certifique-se de ser um arquivo PDF válido.");
        }
      };
      reader.readAsArrayBuffer(fileInput.files[0]);
    }

    // BUSCA DE VAGAS E ANALISE AUTOMÁTICA
    async function buscarVagasNaWeb() {
      const status = document.getElementById('status-auto');
      const estante = document.getElementById('estante-vagas');
      status.innerText = "🛰️ Buscando vagas em tempo real e calculando compatibilidade...";
      estante.innerHTML = '';

      const cvTexto = localStorage.getItem('cv_texto_base') || document.getElementById('cv-text').value;
      const skillsCv = TECH_SKILLS.filter(s => cvTexto.toLowerCase().includes(s));

      try {
        // Busca vagas remotas em API pública segura
        const res = await fetch('https://remotive.com/api/remote-jobs?category=software-dev&limit=10');
        const data = await res.json();
        const vagas = data.jobs;

        status.innerText = `✅ ${vagas.length} vagas encontradas e analisadas!`;

        vagas.forEach(vaga => {
          const desc = vaga.description.replace(/(<([^>]+)>)/gi, ""); // Remove HTML
          const descLower = desc.toLowerCase();
          
          // Cruzamento de dados
          const skillsVaga = TECH_SKILLS.filter(s => descLower.includes(s));
          let match = 100;
          if (skillsVaga.length > 0) {
            const batem = skillsVaga.filter(s => skillsCv.includes(s));
            match = Math.round((batem.length / skillsVaga.length) * 100);
          }

          estante.innerHTML += `
            <div class="shelf-item">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <strong>${vaga.title}</strong>
                <span class="tag ${match >= 50 ? 'tag-success' : 'tag-warning'}">${match}% Match</span>
              </div>
              <span style="font-size:0.8rem; color:var(--text-muted);">${vaga.company_name} • ${vaga.candidate_required_location}</span>
              <p style="font-size:0.75rem; background:var(--surface-input); padding:8px; border-radius:6px; max-height:80px; overflow:hidden;">${desc.substring(0, 150)}...</p>
              <a href="${vaga.url}" target="_blank" class="btn-primary" style="text-align:center; text-decoration:none; font-size:0.8rem; margin-top:4px;">Ver Vaga Original</a>
            </div>
          `;
        });
      } catch (err) {
        status.innerText = "⚠️ Erro ao conectar com o serviço de vagas.";
      }
    }

    // FILTRAGEM
    function filtrarVagas(termo) {
      const itens = document.querySelectorAll('.shelf-item');
      itens.forEach(i => {
        i.style.display = i.innerText.toLowerCase().includes(termo.toLowerCase()) ? 'flex' : 'none';
      });
    }

    // TEMA
    function aplicarTema(t) {
      document.body.className = t === 'default' ? '' : 'theme-' + t;
      localStorage.setItem('radar_theme', t);
    }

    // INICIALIZAÇÃO
    window.addEventListener('DOMContentLoaded', () => {
      const cvSalvo = localStorage.getItem('cv_texto_base');
      if (cvSalvo) document.getElementById('cv-text').value = cvSalvo;

      const temaSalvo = localStorage.getItem('radar_theme');
      if (temaSalvo) aplicarTema(temaSalvo);
    });
  </script>
</body>
</html>
