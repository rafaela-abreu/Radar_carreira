<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar da Carreira - Rafaela</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Leitor de Arquivos PDF em JavaScript -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b0d14 0%, #111422 100%);
      --surface-1: #161a29;
      --surface-2: #1e2438;
      --surface-card: #181c2e;
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.25);
      --border: #282f45;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --status-success: #10b981;
      --status-warning: #f59e0b;
      --status-danger: #ef4444;

      --radius-lg: 16px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px;
    }

    #app-wrapper {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      background: var(--surface-1);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: var(--radius-lg);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.15rem;
      background: linear-gradient(90deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-status {
      background: rgba(16, 185, 129, 0.15);
      color: var(--status-success);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    nav.nav-scroller {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    nav.nav-scroller::-webkit-scrollbar { display: none; }

    .nav-btn {
      background: var(--surface-1);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 12px 18px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .tab-pane {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .tab-pane.active { display: flex; }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .metric-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .metric-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
    .metric-value { font-size: 1.5rem; font-weight: 800; color: var(--text-main); }

    .dossier-card {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }

    .form-control {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      outline: none;
    }

    .form-control:focus { border-color: var(--primary); }

    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .ai-analysis-box {
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid var(--primary);
      border-radius: var(--radius-md);
      padding: 12px;
      font-size: 0.85rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div id="app-wrapper">
    <header>
      <div class="brand-title"><span>🛰️</span> RADAR DA CARREIRA</div>
      <span class="badge-status">INDEXDB ON</span>
    </header>

    <nav class="nav-scroller">
      <button class="nav-btn active" onclick="openTab(event, 'tab-dashboard')">🏠 Dashboard</button>
      <button class="nav-btn" onclick="openTab(event, 'tab-vagas')">💼 Vagas</button>
      <button class="nav-btn" onclick="openTab(event, 'tab-candidaturas')">🗄️ Candidaturas</button>
      <button class="nav-btn" onclick="openTab(event, 'tab-curriculo')">📄 Currículo e IA</button>
      <button class="nav-btn" onclick="openTab(event, 'tab-config')">⚙️ Configurações IA</button>
    </nav>

    <!-- DASHBOARD -->
    <section id="tab-dashboard" class="tab-pane active">
      <div class="metrics-grid">
        <div class="metric-card">
          <span class="metric-label">💼 Vagas no Banco</span>
          <span class="metric-value" id="dash-vagas">0</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">📩 Candidaturas Enviadas</span>
          <span class="metric-value" id="dash-candidaturas">0</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">📄 Versões de Currículo</span>
          <span class="metric-value" id="dash-curriculos">0</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">🧠 Análises de IA</span>
          <span class="metric-value" id="dash-analises">0</span>
        </div>
      </div>
    </section>

    <!-- VAGAS -->
    <section id="tab-vagas" class="tab-pane">
      <div class="dossier-card">
        <h3>📂 Cadastrar Dossiê da Vaga</h3>
        <div class="form-group">
          <label>Empresa</label>
          <input type="text" id="vaga-empresa" class="form-control" placeholder="Ex: Tech Corp">
        </div>
        <div class="form-group">
          <label>Cargo</label>
          <input type="text" id="vaga-cargo" class="form-control" placeholder="Ex: Desenvolvedora Front-End Jr">
        </div>
        <div class="form-group">
          <label>Descrição e Requisitos da Vaga</label>
          <textarea id="vaga-desc" class="form-control" rows="4" placeholder="Cole o anúncio completo..."></textarea>
        </div>
        <button class="btn-primary" onclick="salvarVagaDB()">💾 Salvar Vaga no Banco de Dados</button>
      </div>
      <div id="lista-vagas-db"></div>
    </section>

    <!-- CANDIDATURAS -->
    <section id="tab-candidaturas" class="tab-pane">
      <div class="dossier-card">
        <h3>🗄️ Registrar Envio de Candidatura</h3>
        <div class="form-group">
          <label>Selecione a Vaga</label>
          <select id="cand-vaga-select" class="form-control"></select>
        </div>
        <div class="form-group">
          <label>Versão do Currículo Utilizado</label>
          <input type="text" id="cand-version" class="form-control" placeholder="Ex: Currículo FrontEnd V2">
        </div>
        <div class="form-group">
          <label>Texto/Carta de Apresentação Enviada</label>
          <textarea id="cand-texto" class="form-control" rows="3" placeholder="Cole o texto exato que enviou..."></textarea>
        </div>
        <button class="btn-primary" onclick="salvarCandidaturaDB()">📤 Registrar Candidatura</button>
      </div>
      <div id="lista-candidaturas-db"></div>
    </section>

    <!-- CURRÍCULO & ANÁLISE IA -->
    <section id="tab-curriculo" class="tab-pane">
      <div class="dossier-card">
        <h3>📄 Anexar Currículo & Analisar com IA</h3>
        <div class="form-group">
          <label>Anexar arquivo PDF do Currículo</label>
          <input type="file" id="cv-file" class="form-control" accept="application/pdf" onchange="extrairTextoPDF()">
        </div>
        <div class="form-group">
          <label>Texto Extraído do Currículo</label>
          <textarea id="cv-text" class="form-control" rows="5" placeholder="O conteúdo extraído do PDF aparecerá aqui..."></textarea>
        </div>
        <button class="btn-primary" onclick="analisarCurriculoIA()">🧠 Analisar Erros & Cruzar Requisitos com IA</button>
      </div>
      <div id="ai-resultado" class="ai-analysis-box" style="display:none;"></div>
    </section>

    <!-- CONFIGURAÇÕES DE IA -->
    <section id="tab-config" class="tab-pane">
      <div class="dossier-card">
        <h3>⚙️ Conexão de Inteligência Artificial</h3>
        <div class="form-group">
          <label>Chave de API OpenRouter / OpenAI / Gemini</label>
          <input type="password" id="api-key" class="form-control" placeholder="Cole sua API Key aqui">
        </div>
        <button class="btn-primary" onclick="salvarApiKey()">💾 Salvar Chave de API</button>
      </div>
    </section>
  </div>

  <script>
    // ⚙️ INICIALIZAÇÃO DO BANCO DE DADOS INDEXEDDB
    let db;
    const request = indexedDB.open("RadarCarreiraDB", 1);

    request.onupgradeneeded = function(e) {
      db = e.target.result;
      if (!db.objectStoreNames.contains("vagas")) db.createObjectStore("vagas", { keyPath: "id", autoIncrement: true });
      if (!db.objectStoreNames.contains("candidaturas")) db.createObjectStore("candidaturas", { keyPath: "id", autoIncrement: true });
      if (!db.objectStoreNames.contains("curriculos")) db.createObjectStore("curriculos", { keyPath: "id", autoIncrement: true });
    };

    request.onsuccess = function(e) {
      db = e.target.result;
      carregarDadosDB();
    };

    function openTab(evt, tabId) {
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      evt.currentTarget.classList.add('active');
    }

    // 💼 SALVAR E LISTAR VAGAS NO INDEXEDDB
    function salvarVagaDB() {
      const empresa = document.getElementById('vaga-empresa').value;
      const cargo = document.getElementById('vaga-cargo').value;
      const desc = document.getElementById('vaga-desc').value;

      if (!empresa || !cargo) return alert("Preencha a Empresa e o Cargo.");

      const transaction = db.transaction(["vagas"], "readwrite");
      const store = transaction.objectStore("vagas");
      store.add({ empresa, cargo, desc, data: new Date().toLocaleDateString('pt-BR') });

      transaction.oncomplete = function() {
        alert("Vaga salva com sucesso no banco de dados local!");
        document.getElementById('vaga-empresa').value = '';
        document.getElementById('vaga-cargo').value = '';
        document.getElementById('vaga-desc').value = '';
        carregarDadosDB();
      };
    }

    // 🗄️ REGISTRAR CANDIDATURA
    function salvarCandidaturaDB() {
      const vagaId = document.getElementById('cand-vaga-select').value;
      const versao = document.getElementById('cand-version').value;
      const texto = document.getElementById('cand-texto').value;

      if (!vagaId || !versao) return alert("Selecione uma vaga e informe a versão do currículo.");

      const transaction = db.transaction(["candidaturas"], "readwrite");
      const store = transaction.objectStore("candidaturas");
      store.add({ vagaId, versao, texto, data: new Date().toLocaleDateString('pt-BR') });

      transaction.oncomplete = function() {
        alert("Candidatura registrada!");
        carregarDadosDB();
      };
    }

    // 📄 EXTRAÇÃO DE TEXTO DO PDF
    async function extrairTextoPDF() {
      const file = document.getElementById('cv-file').files[0];
      if (!file) return;

      const fileReader = new FileReader();
      fileReader.onload = async function() {
        const typedarray = new Uint8Array(this.result);
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        const pdf = await pdfjsLib.getDocument(typedarray).promise;
        let textoTotal = '';

        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          textoTotal += content.items.map(item => item.str).join(' ') + '\n';
        }

        document.getElementById('cv-text').value = textoTotal;
      };
      fileReader.readAsArrayBuffer(file);
    }

    // 🧠 ANÁLISE DE CURRÍCULO POR IA
    async function analisarCurriculoIA() {
      const apiKey = localStorage.getItem('radar_api_key');
      const cvText = document.getElementById('cv-text').value;

      if (!cvText) return alert("Extraia ou digite o texto do currículo primeiro.");

      const resultadoBox = document.getElementById('ai-resultado');
      resultadoBox.style.display = "block";
      resultadoBox.innerText = "🧠 Analisando currículo e verificando erros estruturais...";

      if (!apiKey) {
        setTimeout(() => {
          resultadoBox.innerHTML = "<strong>Modo de Simulação (Sem API Key):</strong><br>• Destaque mais suas experiências com Front-End.<br>• Adicione uma seção clara de projetos no GitHub.<br>• NENHUM erro ortográfico grave encontrado.";
        }, 1500);
        return;
      }
    }

    // ⚙️ CONFIGURAÇÃO DE API
    function salvarApiKey() {
      const key = document.getElementById('api-key').value;
      localStorage.setItem('radar_api_key', key);
      alert("Chave de API salva com sucesso!");
    }

    // 🔄 CARREGAR DADOS DO BANCO E ATUALIZAR INTERFACE
    function carregarDadosDB() {
      if (!db) return;

      // Atualizar lista de vagas na seleção da candidatura
      const vagaSelect = document.getElementById('cand-vaga-select');
      vagaSelect.innerHTML = '';

      const txVagas = db.transaction(["vagas"], "readonly");
      const storeVagas = txVagas.objectStore("vagas");
      let countVagas = 0;

      storeVagas.openCursor().onsuccess = function(e) {
        const cursor = e.target.result;
        if (cursor) {
          countVagas++;
          const opt = document.createElement('option');
          opt.value = cursor.value.id;
          opt.innerText = `${cursor.value.cargo} - ${cursor.value.empresa}`;
          vagaSelect.appendChild(opt);
          cursor.continue();
        } else {
          document.getElementById('dash-vagas').innerText = countVagas;
        }
      };

      const txCand = db.transaction(["candidaturas"], "readonly");
      let countCand = 0;
      txCand.objectStore("candidaturas").openCursor().onsuccess = function(e) {
        const cursor = e.target.result;
        if (cursor) {
          countCand++;
          cursor.continue();
        } else {
          document.getElementById('dash-candidaturas').innerText = countCand;
        }
      };
    }
  </script>
</body>
  </html>
