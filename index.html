<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar da Carreira - Autônomo</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>

  <div id="app-wrapper">
    <header>
      <div class="brand-title"><span>🛰️</span> RADAR AUTÔNOMO</div>
      <button class="btn-theme-toggle" onclick="openTab(event, 'tab-theme')">🎨 Tema</button>
    </header>

    <div id="status-bar" class="status-card">
      <span id="status-auto">⚡ Modulo de captura autônoma pronto.</span>
    </div>

    <nav class="nav-scroller">
      <button class="nav-btn active" onclick="openTab(event, 'tab-vagas')">💼 Vagas Encontradas</button>
      <button class="nav-btn" onclick="openTab(event, 'tab-candidaturas')">🗄️ Candidaturas</button>
      <button class="nav-btn" onclick="openTab(event, 'tab-curriculo')">📄 Meu Perfil (CV)</button>
      <button class="nav-btn" onclick="openTab(event, 'tab-theme')">🎨 Apagador/Tema</button>
    </nav>

    <!-- ESTANTE DE VAGAS -->
    <section id="tab-vagas" class="tab-pane active">
      <div class="card-action">
        <button class="btn-primary" onclick="rodarBuscaAutonoma()">🔄 Varrer Web Agora</button>
        <input type="text" class="form-control" placeholder="🔍 Filtrar vagas..." oninput="filtrarVagas(this.value)">
      </div>
      <div id="estante-vagas" class="shelf-grid"></div>
    </section>

    <!-- CANDIDATURAS -->
    <section id="tab-candidaturas" class="tab-pane">
      <div id="estante-candidaturas" class="shelf-grid"></div>
    </section>

    <!-- MEU PERFIL (CV PARSER) -->
    <section id="tab-curriculo" class="tab-pane">
      <div class="card">
        <h3>📄 Base do Seu Perfil</h3>
        <p style="font-size:0.8rem; color:var(--text-muted);">Anexe seu currículo apenas uma vez para o robô usar como referência de cruzamento.</p>
        <input type="file" id="cv-file" class="form-control" accept="application/pdf" onchange="extrairTextoPDF()">
        <textarea id="cv-text" class="form-control" rows="4" placeholder="O robô usará o texto extraído para comparar com as vagas..."></textarea>
      </div>
    </section>

    <!-- TEMAS -->
    <section id="tab-theme" class="tab-pane">
      <div class="card">
        <h3>🎨 Aparência e Layout</h3>
        <div class="theme-buttons">
          <button class="btn-theme" style="background:#6366f1;" onclick="aplicarTema('default')">Dark Purple</button>
          <button class="btn-theme" style="background:#f4f1ea; color:#000;" onclick="aplicarTema('paper')">Paper Light</button>
          <button class="btn-theme" style="background:#10b981;" onclick="aplicarTema('emerald')">Emerald</button>
          <button class="btn-theme" style="background:#ff007f;" onclick="aplicarTema('cyberpunk')">Cyberpunk</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    function openTab(evt, tabId) {
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if (evt && evt.currentTarget) evt.currentTarget.classList.add('active');
    }
  </script>
  
  <script src="db.js"></script>
  <script src="search.js"></script>
  <script src="ai.js"></script>
</body>
</html>
